# https://www.playframework.com/documentation/latest/Configuration
# conf/application.conf
play.modules.enabled += "db.DatabaseModule"
db.default {
  driver   = "com.mysql.cj.jdbc.Driver"
  url      = "jdbc:mysql://localhost:3306/student management?useSSL=false&serverTimezone=UTC"
  username = "root"
  password = ""
}
play.evolutions.db.default.autoApply = true
# Quill reads from this "ctx" block
ctx.dataSource.url          = ${db.default.url}
ctx.dataSource.user         = ${db.default.username}
ctx.dataSource.password     = ${db.default.password}
ctx.dataSource.driverClassName = "com.mysql.cj.jdbc.Driver"

# Play secret key (change this in production)
play.http.secret.key = "changeme-123456789-abcdefghijklmnop-this-is-a-long-secret-key"

#JWT Configuration
jwt{
  secret= ${?JWT_SECRET }
  secret = "2af534fcd369dbb310157b1be060956bb3a4241bdec820b4d8af13e4f4fb76d9"
  issuer="student management"
}
# BCrypt Configuration

bcrypt {
  logRounds = 10
}